[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topgrade-update"
version = "1.0.0"
description = "An interactive update notifier & applier using topgrade"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5", "jeepney>=0.8"]
dev = ["mypy>=1.0", "ruff>=0.5", "pytest>=8.0", "pytest-qt>=4.0"]

[project.scripts]
topgrade-update = "topgrade_update.cli.main:main"

# Third-party plugins can register via:
# [project.entry-points."topgrade_update.plugins"]
# mychecker = "mypackage.plugins:MyChecker"

[project.urls]
Homepage = "https://github.com/topgrade-update/topgrade-update"

[tool.hatch.build.targets.wheel]
packages = ["src/topgrade_update"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["PySide6.*", "jeepney.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"
