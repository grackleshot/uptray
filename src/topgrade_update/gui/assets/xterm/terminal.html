<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="xterm.css" />
  <style>
    html, body, #term { margin: 0; height: 100%; width: 100%; background: #1e1e1e; }
  </style>
</head>
<body>
  <div id="term"></div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontFamily: "monospace",
      fontSize: 13,
      theme: { background: "#1e1e1e" },
      convertEol: true,
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("term"));
    fit.fit();
    term.onData((data) => {
      if (window.bridge && window.bridge.sendInput) {
        window.bridge.sendInput(data);
      }
    });
    window.addEventListener("resize", () => fit.fit());
    window.termApi = {
      write(text) { term.write(text); },
      clear() { term.clear(); },
      focus() { term.focus(); },
      fit() { fit.fit(); },
      cols() { return term.cols; },
      rows() { return term.rows; },
    };
  </script>
</body>
</html>
